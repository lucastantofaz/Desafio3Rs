<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c3b25">
  <title>Click — Climatização IFSP (Versão Beta)</title>
  <!-- Tipografia limpa e institucional: Plus Jakarta Sans e JetBrains Mono para números -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       STYLE.CSS — Tema Claro Institucional IFSP (Editorial & Flat Design)
       Zero gradientes, cores sólidas, ilustrações vetoriais e alta legibilidade.
       ========================================================================== */
    :root {
      /* Paleta Oficial IFSP & Tons Papel Editorial */
      --floresta: #0c3b25;       /* Verde escuro institucional */
      --verde: #2f9e41;          /* Verde principal IFSP */
      --verde-medio: #237a31;
      --verde-claro: #e5f3e8;    /* Fundo suave de seleção */
      --verde-borda: #b7dfc0;
      --vermelho: #cd2a2e;       /* Vermelho oficial da marca IFSP */
      --vermelho-claro: #fceaea;
      --vermelho-borda: #f3babc;

      /* Superfícies Claras (Sem Gradientes) */
      --papel: #f3f6f4;
      --papel-secundario: #e8eeea;
      --branco: #ffffff;

      /* Tipografia e Linhas */
      --tinta: #12261c;
      --suave: #52665b;
      --mudo: #788b80;
      --linha: #d2ddd6;
      --linha-forte: #b2c4b9;

      /* Cores Sólidas de Modos Térmicos */
      --frio: #186cb8;
      --frio-claro: #e6f1fb;
      --quente: #d45b12;
      --quente-claro: #fdf0e6;
      --secar: #0d7a6f;
      --secar-claro: #e4f5f3;
      --ambar: #9e5800;
      --ambar-claro: #fef3de;

      --raio-sm: 8px;
      --raio-md: 12px;
      --raio-lg: 16px;

      --fonte-sans: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      --fonte-mono: "JetBrains Mono", ui-monospace, monospace;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background-color: var(--papel);
      color: var(--tinta);
      font: 15px/1.5 var(--fonte-sans);
      min-height: 100vh;
    }

    h1, h2, h3, h4, p { margin: 0; }
    button { font: inherit; color: inherit; cursor: pointer; user-select: none; }
    button:disabled { cursor: not-allowed; }
    :focus-visible { outline: 3px solid var(--frio); outline-offset: 2px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    [hidden] { display: none !important; }

    /* ---------- Faixa Institucional Superior e Cabeçalho ---------- */
    .top {
      background-color: var(--floresta);
      color: var(--branco);
      border-bottom: 4px solid var(--verde);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 24px;
      height: 70px;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      color: inherit;
      text-decoration: none;
      min-width: 0;
    }

    .brand-logo-svg {
      width: 46px;
      height: 46px;
      flex: none;
      display: block;
    }

    .brand-text-wrap {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-name {
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--branco);
    }

    .brand-inst {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 4px;
      background-color: var(--verde);
      color: var(--branco);
    }

    .brand-sub {
      color: #c2dbcb;
      font-size: 0.82rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    /* Resumo Rápido no Topo */
    .summary-pills {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #082919;
      border: 1px solid #1d573a;
      padding: 5px 12px;
      border-radius: var(--raio-sm);
      font-size: 0.8rem;
      color: #d0e6d8;
    }
    .sum-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 6px;
    }
    .sum-pill + .sum-pill {
      border-left: 1px solid #1d573a;
      padding-left: 12px;
    }
    .sum-val {
      font-family: var(--fonte-mono);
      font-weight: 700;
      color: var(--branco);
    }

    .demo-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: var(--raio-sm);
      background-color: #fdf0e6;
      color: var(--quente);
      border: 2px solid var(--quente);
      white-space: nowrap;
    }

    /* Selo Versão Beta Destacado no Canto */
    .beta-stamp {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--vermelho);
      color: var(--branco);
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: var(--raio-sm);
      border: 2px solid var(--branco);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
      white-space: nowrap;
    }
    .beta-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--branco);
    }

    /* ---------- Estrutura Principal ---------- */
    .shell {
      display: grid;
      grid-template-columns: 330px 1fr;
      max-width: 1320px;
      margin: 0 auto;
      min-height: calc(100vh - 70px);
    }

    /* ---------- Barra Lateral de Salas ---------- */
    .rooms {
      background-color: var(--papel);
      border-right: 2px solid var(--linha);
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Cartão Ilustrado do Campus na Barra Lateral */
    .campus-card {
      background-color: var(--branco);
      border: 2px solid var(--linha);
      border-radius: var(--raio-md);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .campus-svg {
      width: 52px;
      height: 44px;
      flex: none;
    }
    .campus-info h2 {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--floresta);
      line-height: 1.2;
    }
    .campus-info p {
      font-size: 0.78rem;
      color: var(--suave);
      margin-top: 2px;
    }

    .rooms-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search {
      position: relative;
      display: block;
    }
    .search input {
      width: 100%;
      height: 42px;
      padding: 0 12px 0 38px;
      border-radius: var(--raio-sm);
      border: 2px solid var(--linha);
      background-color: var(--branco);
      color: var(--tinta);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .search input::placeholder { color: var(--mudo); }
    .search input:focus {
      outline: none;
      border-color: var(--verde);
    }
    .search-ico {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      color: var(--suave);
      pointer-events: none;
    }

    /* Abas de Filtro Rápido */
    .filter-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background-color: var(--papel-secundario);
      padding: 4px;
      border-radius: var(--raio-sm);
      border: 1px solid var(--linha);
    }
    .filter-tab {
      border: 1px solid transparent;
      background-color: transparent;
      color: var(--suave);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 4px;
      border-radius: 6px;
    }
    .filter-tab:hover { color: var(--floresta); }
    .filter-tab.active {
      background-color: var(--branco);
      color: var(--floresta);
      border-color: var(--linha-forte);
      font-weight: 700;
    }

    .room-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .room {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 12px;
      border-radius: var(--raio-sm);
      color: inherit;
      text-decoration: none;
      background-color: var(--branco);
      border: 2px solid var(--linha);
      border-left: 5px solid var(--linha-forte);
    }
    .room:hover {
      border-color: var(-- verde-borda);
      background-color: #f9fbf9;
    }
    .room.current {
      background-color: var(--verde-claro);
      border-color: var(--verde);
      border-left: 6px solid var(--floresta);
    }

    .room-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      flex: none;
      background-color: #b0c0b6;
    }
    .dot.on {
      background-color: var(--verde);
      border: 2px solid var(--floresta);
    }
    .dot.down {
      background-color: var(--vermelho-claro);
      border: 2.5px solid var(--vermelho);
    }

    .room-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .room-name {
      font-weight: 700;
      font-size: 0.92rem;
      line-height: 1.25;
      color: var(--tinta);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .room-sub {
      font-size: 0.78rem;
      color: var(--suave);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .room-badge-temp {
      font-family: var(--fonte-mono);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background-color: var(--floresta);
      color: var(--branco);
      flex: none;
    }

    .empty-small {
      color: var(--suave);
      font-size: 0.88rem;
      padding: 18px 12px;
      text-align: center;
      background-color: var(--branco);
      border: 2px dashed var(--linha-forte);
      border-radius: var(--raio-sm);
    }

    /* ---------- Palco Principal ---------- */
    .stage {
      padding: 28px 32px 56px;
      min-width: 0;
    }

    /* Cabeçalho da Sala com Arte Vetorial Arquitetônica */
    .stage-head {
      background-color: var(--branco);
      border: 2px solid var(--linha);
      border-left: 6px solid var(--floresta);
      border-radius: var(--raio-md);
      padding: 18px 22px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .stage-head-left {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .room- emblem-svg {
      width: 54px;
      height: 54px;
      flex: none;
    }

    .stage-title-group h1 {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--floresta);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .stage-meta {
      margin-top: 4px;
      font-size: 0.9rem;
    }
    .sum { color: var(--suave); font-weight: 600; }
    .sum.on { color: var(--verde-medio); font-weight: 700; }
    .sum.down { color: var(--vermelho); font-weight: 700; }

    /* Botões de Ação Rápida da Sala */
    .stage-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 14px;
      border-radius: var(--raio-sm);
      border: 2px solid var(--floresta);
      background-color: var(--branco);
      color: var(--floresta);
      font-size: 0.84rem;
      font-weight: 700;
    }
    .action-btn:hover:not(:disabled) {
      background-color: var(--verde-claro);
    }
    .action-btn.danger-btn {
      border-color: var(--vermelho);
      color: var(--vermelho);
    }
    .action-btn.danger-btn:hover:not(:disabled) {
      background-color: var(--vermelho-claro);
    }
    .action-btn .ico { width: 18px; height: 18px; }

    /* Estado Vazio Ilustrado */
    .empty {
      padding: 56px 28px;
      max-width: 480px;
      margin: 32px auto;
      text-align: center;
      background-color: var(--branco);
      border: 2px solid var(--linha);
      border-radius: var(--raio-lg);
    }
    .empty h2 { font-size: 1.35rem; color: var(--floresta); margin: 12px 0 6px; }
    .empty p { color: var(--suave); }

    /* Grid de Aparelhos */
    .units {
      display: grid;
      gap: 24px;
      grid-template-columns: minmax(0, 520px);
    }
    .units.n2, .units.n3 {
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
    }

    /* ---------- Cartão do Aparelho (Unit Card) ---------- */
    .unit {
      --acento-modo: var(--verde);
      --fundo-modo: var(--verde-claro);
      background-color: var(--branco);
      border-radius: var(--raio-lg);
      padding: 20px 22px 24px;
      border: 2px solid var(--linha);
      border-top: 6px solid var(--verde);
      box-shadow: 0 3px 0 var(--linha);
    }
    .unit.m-cool { --acento-modo: var(--frio); --fundo-modo: var(--frio-claro); }
    .unit.m-heat { --acento-modo: var(--quente); --fundo-modo: var(--quente-claro); }
    .unit.m-dry  { --acento-modo: var(--secar); --fundo-modo: var(--secar-claro); }
    .unit.m-fan  { --acento-modo: var(--verde-medio); --fundo-modo: var(--verde-claro); }
    .unit.m-auto { --acento-modo: var(--floresta); --fundo-modo: var(--verde-claro); }

    .unit.offline {
      border-top-color: var(--vermelho);
      border-color: var(--vermelho-borda);
    }

    .unit-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .unit-head h3 {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--floresta);
    }

    /* Etiqueta de Status do Comando */
    .chip {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      background-color: var(--papel-secundario);
      color: var(--suave);
      border: 1px solid var(--linha-forte);
      white-space: nowrap;
    }
    .chip.good {
      background-color: var(--verde-claro);
      color: var(--floresta);
      border-color: var(--verde);
    }
    .chip.bad {
      background-color: var(--vermelho-claro);
      color: var(--vermelho);
      border-color: var(--vermelho);
    }
    .chip.warn {
      background-color: var(--ambar-claro);
      color: var(--ambar);
      border-color: var(--ambar);
    }
    .chip.busy {
      background-color: var(--frio-claro);
      color: var(--frio);
      border-color: var(--frio);
    }

    /* ---------- Ilustração Editorial do Aparelho Split ---------- */
    .ac-illustration-box {
      background-color: var(--papel);
      border: 2px solid var(--linha);
      border-radius: var(--raio-md);
      padding: 12px 16px 10px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .unit.is-on .ac-illustration-box {
      background-color: var(--fundo-modo);
      border-color: var(--acento-modo);
    }
    .ac-split-svg {
      width: 220px;
      height: 68px;
      display: block;
    }
    .ac-caption {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--suave);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .unit.is-on .ac-caption {
      color: var(--floresta);
    }

    /* ---------- Mostrador de Temperatura (Dial Limpo e Tátil) ---------- */
    .dial {
      position: relative;
      width: min(100%, 286px);
      aspect-ratio: 1;
      margin: 4px auto 6px;
      user-select: none;
    }
    .dial-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .dial .dial-face {
      fill: var(--papel);
      stroke: var(--linha);
      stroke-width: 2;
    }
    .dial .tick {
      stroke: var(--linha-forte);
      stroke-width: 2;
      stroke-linecap: round;
    }
    .dial .tick.lit {
      stroke: var(--acento-modo);
    }
    .dial .track {
      fill: none;
      stroke: #dce5df;
      stroke-width: 12;
      stroke-linecap: round;
    }
    .dial .value {
      fill: none;
      stroke: var(--acento-modo);
      stroke-width: 12;
      stroke-linecap: round;
    }
    .dial .thumb {
      fill: var(--branco);
      stroke: var(--acento-modo);
      stroke-width: 4;
    }
    .dial .scale-txt {
      fill: var(--suave);
      font-family: var(--fonte-mono);
      font-size: 10px;
      font-weight: 700;
      text-anchor: middle;
    }

    .readout {
      position: absolute;
      left: 18%;
      right: 18%;
      top: 28%;
      text-align: center;
      pointer-events: none;
    }
    .temp {
      display: inline-flex;
      align-items: flex-start;
      font-family: var(--fonte-mono);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .temp .n {
      font-size: clamp(3.5rem, 15vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--floresta);
    }
    .temp .u {
      font-size: 1.35rem;
      font-weight: 700;
      margin-top: 0.4rem;
      margin-left: 2px;
      color: var(--suave);
    }
    .dial:not(.is-on) .temp .n {
      color: #96a79d;
    }
    .dial.is-pending .temp .n {
      color: var(--ambar);
    }

    .state {
      color: var(--suave);
      font-size: 0.88rem;
      font-weight: 700;
      margin-top: 6px;
    }
    .dial.is-on .state {
      color: var(--acento-modo);
    }

    /* Botões Redondos (Ligar, -, +) */
    .power, .round {
      position: absolute;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    .power {
      width: 64px;
      height: 64px;
      left: calc(50% - 32px);
      bottom: 2%;
      background-color: var(--papel-secundario);
      border: 2px solid var(--linha-forte);
      color: var(--suave);
    }
    .power .ico { width: 28px; height: 28px; }
    .power:hover:not(:disabled) {
      border-color: var(--floresta);
      color: var(--floresta);
    }
    .power.is-on {
      background-color: var(--verde);
      border-color: var(--floresta);
      color: var(--branco);
    }
    .power:disabled { opacity: 0.45; }

    .round {
      width: 50px;
      height: 50px;
      bottom: 6%;
      background-color: var(--branco);
      border: 2px solid var(--linha-forte);
      color: var(--floresta);
    }
    .round .ico { width: 22px; height: 22px; stroke-width: 2.4; }
    .round.minus { left: 6%; }
    .round.plus { right: 6%; }
    .round:hover:not(:disabled) {
      border-color: var(--verde);
      background-color: var(--verde-claro);
    }
    .round:disabled { opacity: 0.35; }
    .ico { width: 22px; height: 22px; flex: none; }

    .hint {
      margin-top: 12px;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .hint.bad {
      color: var(--vermelho);
      background-color: var(--vermelho-claro);
      border: 2px solid var(--vermelho-borda);
      padding: 10px 12px;
      border-radius: var(--raio-sm);
    }

    /* ---------- Controles Segmentados ---------- */
    .controls {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-top: 16px;
      border-top: 2px solid var(--papel-secundario);
    }
    .group h4 {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--suave);
      margin-bottom: 8px;
    }
    .group.row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background-color: var(--papel);
      padding: 10px 14px;
      border-radius: var(--raio-sm);
      border: 2px solid var(--linha);
    }
    .group.row h4 {
      margin: 0;
      font-size: 0.92rem;
      text-transform: none;
      letter-spacing: 0;
      color: var(--tinta);
      font-weight: 700;
    }

    .seg {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 4px;
      background-color: var(--papel);
      padding: 4px;
      border-radius: var(--raio-sm);
      border: 2px solid var(--linha);
    }
    .seg-btn {
      min-height: 44px;
      border: 2px solid transparent;
      background-color: transparent;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--suave);
      padding: 4px 2px;
    }
    .seg-btn.with-ico {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 0.75rem;
      min-height: 58px;
    }
    .seg-btn.with-ico .ico { width: 20px; height: 20px; }
    .seg-btn.sel {
      background-color: var(--branco);
      color: var(--floresta);
      font-weight: 800;
      border-color: var(--verde);
    }
    .seg-btn.sel .ico {
      color: var(--acento-modo);
    }
    .seg-btn:disabled { opacity: 0.4; }
    .seg-btn:hover:not(:disabled):not(.sel) {
      color: var(--floresta);
      background-color: var(--papel-secundario);
    }

    /* Chave Seletora de Oscilação das Aletas */
    .switch {
      width: 56px;
      height: 32px;
      border-radius: 999px;
      border: 2px solid var(--linha-forte);
      background-color: #cbd7cf;
      position: relative;
      padding: 0;
      flex: none;
    }
    .switch .knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-color: var(--branco);
      border: 1.5px solid var(--floresta);
    }
    .switch.sel {
      background-color: var(--verde);
      border-color: var(--floresta);
    }
    .switch.sel .knob {
      transform: translateX(24px);
    }
    .switch:disabled { opacity: 0.45; }

    /* Nota Explicativa no Rodapé */
    .note-box {
      margin-top: 26px;
      max-width: 72ch;
      background-color: var(--branco);
      border: 2px solid var(--linha);
      border-left: 5px solid var(--verde);
      border-radius: var(--raio-sm);
      padding: 12px 16px;
      font-size: 0.85rem;
      color: var(--suave);
      font-weight: 500;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      background-color: var(--floresta);
      color: var(--branco);
      border: 2px solid var(--verde);
      padding: 12px 18px;
      border-radius: var(--raio-sm);
      font-weight: 600;
      max-width: calc(100vw - 32px);
      z-index: 50;
    }

    /* ---------- Telas Estreitas (Celular e Tablet) ---------- */
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .summary-pills, .campus-card { display: none; }
      .rooms {
        border-right: 0;
        border-bottom: 2px solid var(--linha);
        padding: 12px 16px;
        position: sticky;
        top: 70px;
        background-color: var(--papel);
        z-index: 20;
      }
      .room-list {
        flex-direction: row;
        overflow-x: auto;
        gap: 8px;
        padding-bottom: 4px;
        scroll-snap-type: x proximity;
        -webkit-overflow-scrolling: touch;
      }
      .room-list li { flex: none; scroll-snap-align: start; }
      .room {
        min-height: 44px;
        padding: 6px 12px;
      }
      .room-sub { display: none; }
      .stage { padding: 20px 16px 40px; }
      .stage-head h1 { font-size: 1.35rem; }
      .brand-sub { display: none; }
      .top { padding: 0 14px; }
    }
    .shell > * { min-width: 0; }
  </style>
</head>

  <!-- ==========================================================================
       DEMO.JS — Dados de Demonstração (Executado sem servidor)
       ========================================================================== -->
  <script>
    "use strict";
    /* Dados e comportamento de demonstração: permite ver e testar a interface sem servidor.
       Contrato que o servidor real deve seguir está descrito em app.js (objeto Api). */

    const Demo = (() => {
      const caps = (extra = {}) => ({
        modes: ["cool", "fan", "dry", "heat", "auto"],
        fan_speeds: ["auto", "low", "medium", "high"],
        swing: ["off", "on"],
        temp_min: 16,
        temp_max: 30,
        temp_step: 1,
        ...extra,
      });
      const dev = (id, name, online, state) => ({
        id,
        name,
        online,
        caps: caps(),
        state: { power: false, mode: "cool", temp_c: 23, fan: "auto", swing: "off", ...state },
        last_command: online ? { status: "sent", at: Date.now() - 120000 } : null,
      });
      const rooms = [
        { id: 1, name: "Sala 101", devices: [dev(11, "Ar-condicionado", true, { power: true, temp_c: 22, fan: "medium", swing: "on" })] },
        { id: 2, name: "Sala 102", devices: [dev(21, "Ar-condicionado", true)] },
        { id: 3, name: "Sala 103", devices: [dev(31, "Ar-condicionado", true, { power: true, mode: "cool", temp_c: 23, fan: "auto" })] },
        { id: 4, name: "Laboratório de informática 1", devices: [
          dev(41, "Ar-condicionado fundo", true, { power: true, temp_c: 21, fan: "high", swing: "on" }),
          dev(42, "Ar-condicionado frente", true, { power: true, temp_c: 21, fan: "high" })
        ] },
        { id: 5, name: "Auditório", devices: [dev(51, "Piso-teto 48.000 BTU", true, { power: true, mode: "cool", temp_c: 24 })] },
        { id: 6, name: "Biblioteca", devices: [dev(61, "Ar-condicionado", true)] },
        { id: 7, name: "Sala dos professores", devices: [dev(71, "Ar-condicionado", false)] },
      ];
      const find = (id) => rooms.flatMap((r) => r.devices).find((d) => d.id === id);
      const delay = (ms) => new Promise((r) => setTimeout(r, ms));

      return {
        async list() { await delay(100); return structuredClone(rooms); },
        async send(id, patch) {
          const d = find(id);
          if (!d || !d.online) throw Object.assign(new Error("offline"), { code: "offline" });
          Object.assign(d.state, patch);
          d.last_command = { status: "sending", at: Date.now() };
          setTimeout(() => { d.last_command = { status: "sent", at: Date.now() }; }, 700);
          await delay(120);
        },
      };
    })();
  </script>

  <!-- ==========================================================================
       APP.JS — Lógica Principal (Sem innerHTML, 100% compatível com o contrato)
       ========================================================================== -->
  <script>
    "use strict";
    /* Interface de controle das salas. Sem login: o acesso é limitado pela rede/ambiente.
       Só createElement/textContent/createElementNS (nada de innerHTML).

       Contrato com o servidor:
         GET  /api/rooms                 -> { rooms: [ { id, name, devices: [ {
                                               id, name, online, state:{power,mode,temp_c,fan,swing},
                                               caps:{modes,fan_speeds,swing,temp_min,temp_max,temp_step},
                                               last_command: null | { status: "sending"|"sent"|"failed"|"unconfirmed", at: <ms> } } ] } ] }
         POST /api/devices/{id}/command  { state: { ...somente os campos alterados } }  -> 202
    */

    const $ = (id) => document.getElementById(id);
    const DEBOUNCE_MS = 350;
    const POLL_MS = 3000;

    const MODE = { cool: "Refrigerar", fan: "Ventilar", dry: "Secar", heat: "Aquecer", auto: "Automático" };
    const FAN = { auto: "Auto", low: "Baixa", medium: "Média", high: "Alta" };

    /* ------------------------------------------------------------------ util */
    function el(tag, props = {}, ...kids) {
      const e = document.createElement(tag);
      for (const [k, v] of Object.entries(props)) {
        if (k === "class") e.className = v;
        else if (k === "text") e.textContent = v;
        else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
        else if (v === true) e.setAttribute(k, "");
        else if (v !== false && v != null) e.setAttribute(k, v);
      }
      for (const k of kids) if (k) e.append(k);
      return e;
    }

    const NS = "http://www.w3.org/2000/svg";
    function svg(tag, attrs = {}, ...kids) {
      const e = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) if (v != null) e.setAttribute(k, v);
      for (const k of kids) if (k) e.append(k);
      return e;
    }

    const icon = (d, extra = {}) => svg("svg", {
      viewBox: "0 0 24 24",
      class: "ico",
      "aria-hidden": "true",
      fill: "none",
      stroke: "currentColor",
      "stroke-width": "1.9",
      "stroke-linecap": "round",
      "stroke-linejoin": "round",
      ...extra
    }, ...d.split("|").map((p) => svg("path", { d: p })));

    const ICONS = {
      cool: "M12 3v18|M4.6 7.5l14.8 9|M4.6 16.5l14.8-9",
      fan: "M3 8h10a3 3 0 1 0-3-3|M3 12h15a3 3 0 1 1-3 3|M3 16h7",
      dry: "M12 3.5s6 6 6 10.5a6 6 0 0 1-12 0C6 9.5 12 3.5 12 3.5z",
      heat: "M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z|M12 2.5v2|M12 19.5v2|M2.5 12h2|M19.5 12h2|M5.3 5.3l1.4 1.4|M17.3 17.3l1.4 1.4|M5.3 18.7l1.4-1.4|M17.3 6.7l1.4-1.4",
      auto: "M5 18l7-13 7 13|M8 13.5h8",
      power: "M12 3v8|M6.6 6.8a8 8 0 1 0 10.8 0",
      minus: "M6 12h12",
      plus: "M12 6v12|M6 12h12",
      check: "M20 6L9 17l-5-5",
    };

    /* ------------------------------------------------------------------ dados */
    const Api = {
      mode: "real",
      async list() {
        if (this.mode === "demo") return Demo.list();
        const r = await fetch("/api/rooms", { headers: { Accept: "application/json" } });
        if (!r.ok) throw new Error("http " + r.status);
        return (await r.json()).rooms;
      },
      async send(id, patch) {
        if (this.mode === "demo") return Demo.send(id, patch);
        const r = await fetch(`/api/devices/${id}/command`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ state: patch }),
        });
        if (!r.ok) {
          let msg = "";
          try { msg = (await r.json()).error.message; } catch { /* sem corpo */ }
          throw Object.assign(new Error(msg || "http " + r.status), {
            code: r.status === 503 ? "offline" : r.status === 429 ? "busy" : "error"
          });
        }
      },
    };

    const S = {
      rooms: [],
      roomId: null,
      filter: "",
      statusFilter: "all",
      pending: new Map() /* deviceId -> {patch, timer} */
    };

    const view = (dev) => ({ ...dev.state, ...(S.pending.get(dev.id)?.patch || {}) });
    const allDevices = () => S.rooms.flatMap((r) => r.devices);

    /* ------------------------------------------------------------------- toast */
    let toastTimer;
    function toast(text) {
      const t = $("toast");
      t.textContent = text;
      t.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
    }

    /* ------------------------------------------------ resumo no cabeçalho */
    function renderSummaryPills() {
      const box = $("summaryPills");
      if (!box) return;
      const devs = allDevices();
      const onCount = devs.filter((d) => d.online && view(d).power).length;
      const offCount = devs.filter((d) => !d.online).length;

      box.replaceChildren(
        el("span", { class: "sum-pill" },
          el("span", { text: "Salas:" }),
          el("span", { class: "sum-val", text: String(S.rooms.length) })
        ),
        el("span", { class: "sum-pill" },
          el("span", { text: "Ligados:" }),
          el("span", { class: "sum-val", text: `${onCount}/${devs.length}` })
        ),
        el("span", { class: "sum-pill" },
          el("span", { text: "Sem conexão:" }),
          el("span", { class: "sum-val", text: String(offCount) })
        )
      );
    }

    /* ------------------------------------------------------------ lista de salas */
    function roomSummary(r) {
      const off = r.devices.filter((d) => !d.online).length;
      const activeDevs = r.devices.filter((d) => d.online && view(d).power);
      const on = activeDevs.length;
      const n = r.devices.length;
      const base = `${n} ${n === 1 ? "aparelho" : "aparelhos"}`;
      const avgTemp = on ? Math.round(activeDevs.reduce((s, d) => s + view(d).temp_c, 0) / on) : null;

      if (off === n) return { cls: "down", text: "Sem conexão", badge: null };
      if (off) return { cls: "on", text: `${base} · ${on} ligado${on === 1 ? "" : "s"} · ${off} sem conexão`, badge: avgTemp ? `${avgTemp}°C` : null };
      if (on) return { cls: "on", text: `${on === n ? "Ligado" : `${on} de ${n} ligados`}`, badge: avgTemp ? `${avgTemp}°C` : null };
      return { cls: "idle", text: "Desligado", badge: null };
    }

    function renderRoomList() {
      const q = S.filter.trim().toLowerCase();
      const list = $("roomList");

      const items = S.rooms.filter((r) => {
        if (q && !r.name.toLowerCase().includes(q)) return false;
        if (S.statusFilter === "on") return r.devices.some((d) => d.online && view(d).power);
        if (S.statusFilter === "offline") return r.devices.some((d) => !d.online);
        return true;
      });

      list.replaceChildren(...items.map((r) => {
        const s = roomSummary(r);
        return el("li", {},
          el("a", {
            href: `#/sala/${r.id}`,
            class: `room ${r.id === S.roomId ? "current" : ""}`,
            "aria-current": r.id === S.roomId ? "page" : null,
          },
            el("span", { class: "room-left" },
              el("span", { class: `dot ${s.cls}`, "aria-hidden": "true" }),
              el("span", { class: "room-text" },
                el("span", { class: "room-name", text: r.name }),
                el("span", { class: "room-sub", text: s.text })
              )
            ),
            s.badge ? el("span", { class: "room-badge-temp", text: s.badge }) : ""
          )
        );
      }));

      if (!items.length) {
        list.append(el("li", { class: "empty-small", text: "Nenhuma sala encontrada." }));
      }
    }

    /* -------------------------------------- Ilustrações Vetoriais Planas (SVG) */
    function roomHeaderIllustration(isActive, isOffline) {
      const strokeColor = "#0c3b25";
      const accentColor = isOffline ? "#cd2a2e" : isActive ? "#2f9e41" : "#96a79d";
      const bgFill = isOffline ? "#fceaea" : isActive ? "#e5f3e8" : "#e8eeea";

      return svg("svg", { viewBox: "0 0 56 56", class: "room-emblem-svg", "aria-hidden": "true" },
        svg("rect", { x: "2", y: "2", width: "52", height: "52", rx: "12", fill: bgFill, stroke: strokeColor, "stroke-width": "2" }),
        // Quadro/Lousa da Sala e Aparelho no Topo
        svg("rect", { x: "12", y: "10", width: "32", height: "9", rx: "2.5", fill: "#ffffff", stroke: strokeColor, "stroke-width": "2" }),
        svg("line", { x1: "16", y1: "15", x2: "40", y2: "15", stroke: accentColor, "stroke-width": "2", "stroke-linecap": "round" }),
        svg("rect", { x: "10", y: "25", width: "36", height: "19", rx: "2", fill: "#ffffff", stroke: strokeColor, "stroke-width": "2" }),
        svg("line", { x1: "16", y1: "32", x2: "30", y2: "32", stroke: accentColor, "stroke-width": "2.2", "stroke-linecap": "round" }),
        svg("line", { x1: "16", y1: "37", x2: "24", y2: "37", stroke: strokeColor, "stroke-width": "2", "stroke-linecap": "round" }),
        svg("circle", { cx: "38", cy: "35", r: "3.5", fill: accentColor })
      );
    }

    function acSplitIllustration(v, isOn, isOnline) {
      const modeColors = {
        cool: "#186cb8",
        heat: "#d45b12",
        dry: "#0d7a6f",
        fan: "#237a31",
        auto: "#0c3b25"
      };
      const waveColor = modeColors[v.mode] || "#2f9e41";
      const ledColor = !isOnline ? "#cd2a2e" : isOn ? "#2f9e41" : "#96a79d";

      const captionText = !isOnline
        ? "Emissor sem conexão"
        : isOn
          ? `Fluxo ativo · Vent. ${FAN[v.fan] || v.fan} · Aletas ${v.swing === "on" ? "oscilando" : "fixas"}`
          : "Aparelho em espera (aletas fechadas)";

      const waves = isOn ? [
        svg("path", { d: "M48 48 C44 55, 52 60, 48 66", stroke: waveColor, "stroke-width": "2.4", "stroke-linecap": "round", fill: "none" }),
        svg("path", { d: "M84 48 C80 55, 88 60, 84 66", stroke: waveColor, "stroke-width": "2.4", "stroke-linecap": "round", fill: "none" }),
        svg("path", { d: "M110 48 C106 55, 114 60, 110 66", stroke: waveColor, "stroke-width": "2.4", "stroke-linecap": "round", fill: "none" }),
        svg("path", { d: "M136 48 C132 55, 140 60, 136 66", stroke: waveColor, "stroke-width": "2.4", "stroke-linecap": "round", fill: "none" }),
        svg("path", { d: "M172 48 C168 55, 176 60, 172 66", stroke: waveColor, "stroke-width": "2.4", "stroke-linecap": "round", fill: "none" })
      ] : [];

      return el("div", { class: "ac-illustration-box", "aria-hidden": "true" },
        svg("svg", { viewBox: "0 0 220 68", class: "ac-split-svg" },
          // Corpo do Ar-Condicionado Split
          svg("rect", { x: "20", y: "6", width: "180", height: "38", rx: "7", fill: "#ffffff", stroke: "#0c3b25", "stroke-width": "2.2" }),
          // Linha de acabamento frontal
          svg("line", { x1: "28", y1: "16", x2: "160", y2: "16", stroke: "#d2ddd6", "stroke-width": "2", "stroke-linecap": "round" }),
          // Visor Digital no Split + LED
          svg("rect", { x: "168", y: "12", width: "22", height: "12", rx: "2.5", fill: "#0c3b25" }),
          svg("circle", { cx: "162", cy: "18", r: "2.8", fill: ledColor }),
          svg("text", {
            x: "179",
            y: "21",
            fill: "#ffffff",
            "font-family": "monospace",
            "font-size": "8.5",
            "font-weight": "700",
            "text-anchor": "middle"
          }, document.createTextNode(isOn ? `${v.temp_c}°` : "--")),
          // Aleta inferior (aberta quando ligado, fechada quando desligado)
          svg("rect", {
            x: "26",
            y: isOn ? "37" : "35",
            width: "168",
            height: isOn ? "6" : "4",
            rx: "2",
            fill: isOn ? waveColor : "#d2ddd6",
            stroke: "#0c3b25",
            "stroke-width": "1.6"
          }),
          ...waves
        ),
        el("span", { class: "ac-caption", text: captionText })
      );
    }

    /* --------------------------------------------------------------- dial SVG */
    function polar(cx, cy, r, deg) {
      const rad = (deg * Math.PI) / 180;
      return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
    }

    function arcPath(cx, cy, r, a0, a1) {
      const [x0, y0] = polar(cx, cy, r, a0);
      const [x1, y1] = polar(cx, cy, r, a1);
      return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
    }

    function dial(v, caps, on) {
      const START = 135, SPAN = 270, cx = 130, cy = 130, r = 98;
      const range = Math.max(1, caps.temp_max - caps.temp_min);
      const f = Math.min(1, Math.max(0, (v.temp_c - caps.temp_min) / range));
      const end = START + SPAN * f;

      const totalTicks = 14;
      const ticks = [];
      for (let i = 0; i <= totalTicks; i++) {
        const tf = i / totalTicks;
        const deg = START + SPAN * tf;
        const [x1, y1] = polar(cx, cy, r + 12, deg);
        const [x2, y2] = polar(cx, cy, r + 19, deg);
        const lit = on && tf <= f + 0.005;
        ticks.push(svg("line", {
          x1: x1.toFixed(2),
          y1: y1.toFixed(2),
          x2: x2.toFixed(2),
          y2: y2.toFixed(2),
          class: `tick ${lit ? "lit" : ""}`
        }));
      }

      const [minX, minY] = polar(cx, cy, r + 26, START);
      const [maxX, maxY] = polar(cx, cy, r + 26, START + SPAN);
      const [thumbX, thumbY] = polar(cx, cy, r, end);

      return svg("svg", { viewBox: "0 0 260 260", class: "dial-svg", "aria-hidden": "true" },
        svg("circle", { cx, cy, r: r - 14, class: "dial-face" }),
        ...ticks,
        svg("text", { x: minX.toFixed(1), y: (minY + 4).toFixed(1), class: "scale-txt" }, document.createTextNode(`${caps.temp_min}°`)),
        svg("text", { x: maxX.toFixed(1), y: (maxY + 4).toFixed(1), class: "scale-txt" }, document.createTextNode(`${caps.temp_max}°`)),
        svg("path", { d: arcPath(cx, cy, r, START, START + SPAN), class: "track" }),
        on && f > 0 ? svg("path", { d: arcPath(cx, cy, r, START, end), class: "value" }) : "",
        on ? svg("circle", { cx: thumbX.toFixed(2), cy: thumbY.toFixed(2), r: "7", class: "thumb" }) : ""
      );
    }

    function statusChip(dev) {
      const c = dev.last_command;
      const when = c ? new Date(c.at).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "";
      if (!dev.online) return ["bad", "Sem conexão"];
      if (S.pending.has(dev.id)) return ["busy", "Ajustando…"];
      if (!c) return ["", "Aguardando comando"];
      switch (c.status) {
        case "sending": return ["busy", "Enviando…"];
        case "sent": return ["good", `Enviado às ${when}`];
        case "failed": return ["bad", "Não foi enviado"];
        default: return ["warn", `Sem confirmação (${when})`];
      }
    }

    function segmented(label, key, options, labels, value, enabled, onPick, withIcons) {
      const grp = el("div", { class: "seg", role: "radiogroup", "aria-label": label });
      for (const o of options) {
        const b = el("button", {
          type: "button",
          role: "radio",
          class: `seg-btn ${withIcons ? "with-ico" : ""} ${o === value ? "sel" : ""}`,
          "aria-checked": o === value ? "true" : "false",
          "data-key": `${key}-${o}`,
          disabled: !enabled,
          onclick: () => onPick(o),
        }, withIcons ? icon(ICONS[o] || ICONS.auto) : "", el("span", { text: labels[o] || o }));
        grp.append(b);
      }
      return el("div", { class: "group" }, el("h4", { text: label }), grp);
    }

    function panel(dev) {
      const caps = dev.caps, v = view(dev), on = dev.online;
      const canTemp = caps.temp_min < caps.temp_max;
      const step = caps.temp_step || 1;
      const bump = (d) => change(dev, { temp_c: Math.min(caps.temp_max, Math.max(caps.temp_min, view(dev).temp_c + d * step)) });
      const [chipCls, chipText] = statusChip(dev);
      const isOn = on && v.power;

      const dialBox = el("div", { class: `dial ${isOn ? "is-on" : ""} ${S.pending.has(dev.id) ? "is-pending" : ""}` },
        dial(v, caps, isOn),
        el("div", { class: "readout" },
          el("div", { class: "temp" },
            el("span", { class: "n", text: isOn || canTemp ? String(v.temp_c) : "—" }),
            el("span", { class: "u", text: "°C" })
          ),
          el("div", { class: "state", text: !on ? "Sem conexão" : isOn ? MODE[v.mode] || v.mode : "Desligado" })
        ),
        canTemp ? el("button", {
          type: "button",
          class: "round minus",
          "aria-label": "Diminuir temperatura",
          "data-key": "minus",
          disabled: !on || !v.power || v.temp_c <= caps.temp_min,
          onclick: () => bump(-1)
        }, icon(ICONS.minus)) : "",
        el("button", {
          type: "button",
          class: `power ${isOn ? "is-on" : ""}`,
          "aria-pressed": isOn ? "true" : "false",
          "aria-label": v.power ? "Desligar" : "Ligar",
          "data-key": "power",
          disabled: !on,
          onclick: () => change(dev, { power: !view(dev).power })
        }, icon(ICONS.power, { "stroke-width": "2.2" })),
        canTemp ? el("button", {
          type: "button",
          class: "round plus",
          "aria-label": "Aumentar temperatura",
          "data-key": "plus",
          disabled: !on || !v.power || v.temp_c >= caps.temp_max,
          onclick: () => bump(1)
        }, icon(ICONS.plus)) : ""
      );

      const ctl = on && v.power;
      const body = el("div", { class: "controls" },
        caps.modes.length > 1 ? segmented("Modo", "mode", caps.modes, MODE, v.mode, ctl, (m) => change(dev, { mode: m }), true) : "",
        caps.fan_speeds.length > 1 ? segmented("Ventilador", "fan", caps.fan_speeds, FAN, v.fan, ctl, (f) => change(dev, { fan: f }), false) : "",
        caps.swing.length > 1 ? el("div", { class: "group row" },
          el("h4", { text: "Oscilação das aletas" }),
          el("button", {
            type: "button",
            class: `switch ${v.swing === "on" ? "sel" : ""}`,
            role: "switch",
            "aria-checked": v.swing === "on" ? "true" : "false",
            "aria-label": "Oscilação das aletas",
            "data-key": "swing",
            disabled: !ctl,
            onclick: () => change(dev, { swing: view(dev).swing === "on" ? "off" : "on" })
          }, el("span", { class: "knob" }))
        ) : ""
      );

      return el("article", {
        class: `unit m-${v.mode} ${isOn ? "is-on" : ""} ${on ? "" : "offline"}`,
        "aria-label": dev.name
      },
        el("header", { class: "unit-head" },
          el("h3", { text: dev.name }),
          el("span", { class: `chip ${chipCls}`, text: chipText })
        ),
        acSplitIllustration(v, isOn, on),
        dialBox,
        !on ? el("p", {
          class: "hint bad",
          text: "O emissor desta sala não está respondendo. Os comandos ficam desativados até a conexão voltar."
        }) : "",
        body
      );
    }

    function batchRoomCommand(room, patch, msg) {
      const onlineDevs = room.devices.filter((d) => d.online);
      if (!onlineDevs.length) return;
      for (const d of onlineDevs) change(d, patch);
      if (msg) toast(msg);
    }

    function renderStage() {
      const stage = $("stage");
      const focusKey = document.activeElement?.dataset?.key;
      const focusUnit = document.activeElement?.closest?.(".unit");
      const unitIdx = focusUnit ? [...stage.querySelectorAll(".unit")].indexOf(focusUnit) : -1;
      const room = S.rooms.find((r) => r.id === S.roomId);

      if (!room) {
        stage.replaceChildren(
          el("div", { class: "empty" },
            roomHeaderIllustration(false, false),
            el("h2", { text: S.rooms.length ? "Escolha uma sala" : "Nenhuma sala cadastrada" }),
            el("p", { text: S.rooms.length ? "Selecione uma sala na lista ao lado para controlar o ar-condicionado." : "Cadastre salas e aparelhos para começar." })
          )
        );
        return;
      }

      const s = roomSummary(room);
      const hasOnline = room.devices.some((d) => d.online);
      const anyOn = room.devices.some((d) => d.online && view(d).power);
      const allOffline = room.devices.every((d) => !d.online);

      stage.replaceChildren(
        el("div", { class: "stage-head" },
          el("div", { class: "stage-head-left" },
            roomHeaderIllustration(anyOn, allOffline),
            el("div", { class: "stage-title-group" },
              el("h1", { text: room.name }),
              el("div", { class: "stage-meta" },
                el("p", { class: `sum ${s.cls}`, text: s.text })
              )
            )
          ),
          hasOnline ? el("div", { class: "stage-actions" },
            el("button", {
              type: "button",
              class: "action-btn",
              onclick: () => batchRoomCommand(room, { power: true, mode: "cool", temp_c: 23, fan: "auto" }, `Padrão 23 °C aplicado em ${room.name}.`)
            }, icon(ICONS.check), el("span", { text: "Padronizar 23 °C" })),
            anyOn ? el("button", {
              type: "button",
              class: "action-btn danger-btn",
              onclick: () => batchRoomCommand(room, { power: false }, `Desligando aparelhos de ${room.name}…`)
            }, icon(ICONS.power), el("span", { text: "Desligar sala" })) : ""
          ) : ""
        ),
        el("div", { class: `units n${Math.min(room.devices.length, 3)}` }, ...room.devices.map(panel)),
        el("p", {
          class: "note-box",
          text: "O sinal infravermelho é de uma via: “Enviado” indica que o emissor da sala transmitiu o comando, não que o aparelho confirmou a execução. Se alguém usar o controle remoto físico na sala, o painel pode ficar desatualizado."
        })
      );

      if (focusKey && unitIdx >= 0) {
        const u = stage.querySelectorAll(".unit")[unitIdx];
        const t = u && u.querySelector(`[data-key="${focusKey}"]`);
        if (t && !t.disabled) t.focus({ preventScroll: true });
      }
    }

    function render() {
      renderSummaryPills();
      renderRoomList();
      renderStage();
    }

    /* ------------------------------------------------------------------ ações */
    function change(dev, part) {
      const cur = S.pending.get(dev.id) || { patch: {}, timer: null };
      cur.patch = { ...cur.patch, ...part };
      clearTimeout(cur.timer);
      cur.timer = setTimeout(() => flush(dev.id), part.power !== undefined ? 0 : DEBOUNCE_MS);
      S.pending.set(dev.id, cur);
      render();
    }

    async function flush(id) {
      const cur = S.pending.get(id);
      if (!cur) return;
      S.pending.delete(id);
      const patch = cur.patch;
      const d = allDevices().find((x) => x.id === id);
      if (d) {
        Object.assign(d.state, patch);
        d.last_command = { status: "sending", at: Date.now() };
        render();
      }
      try {
        await Api.send(id, patch);
      } catch (e) {
        toast(
          e.code === "offline" ? "Emissor sem conexão: o comando não foi enviado."
          : e.code === "busy" ? "Muitos comandos em pouco tempo. Aguarde alguns segundos."
          : "Não foi possível enviar o comando. Tente novamente."
        );
      }
      if (!S.pending.has(id)) await refresh();
    }

    let refreshing = false;
    async function refresh() {
      if (refreshing) return;
      refreshing = true;
      try {
        const rooms = await Api.list();
        S.rooms = rooms;
        if (S.roomId == null || !rooms.some((r) => r.id === S.roomId)) {
          const fromHash = /^#\/sala\/(\d+)$/.exec(location.hash);
          S.roomId = fromHash && rooms.some((r) => r.id === +fromHash[1]) ? +fromHash[1] : (rooms[0] ? rooms[0].id : null);
        }
        render();
      } catch {
        toast("Sem conexão com o servidor.");
      } finally {
        refreshing = false;
      }
    }

    /* ---------------------------------------------------------------- partida */
    window.addEventListener("hashchange", () => {
      const m = /^#\/sala\/(\d+)$/.exec(location.hash);
      if (m) {
        S.roomId = +m[1];
        render();
        window.scrollTo({ top: 0 });
      }
    });

    $("search").addEventListener("input", (e) => {
      S.filter = e.target.value;
      renderRoomList();
    });

    document.querySelectorAll("[data-status-filter]").forEach((btn) => {
      btn.addEventListener("click", () => {
        S.statusFilter = btn.dataset.statusFilter;
        document.querySelectorAll("[data-status-filter]").forEach((b) => b.classList.toggle("active", b === btn));
        renderRoomList();
      });
    });

    setInterval(() => {
      if (document.visibilityState === "visible" && !S.pending.size) refresh();
    }, POLL_MS);

    (async () => {
      const forceDemo = new URLSearchParams(location.search).has("demo") || location.protocol === "file:";
      if (!forceDemo) {
        try { await Api.list(); } catch { Api.mode = "demo"; }
      } else {
        Api.mode = "demo";
      }
      $("demoTag").hidden = Api.mode !== "demo";
      await refresh();
    })();
  </script>
</body>
</html>
