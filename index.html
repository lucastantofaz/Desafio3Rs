<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c3b25">
  <title>Click — Climatização IFSP (Versão Beta)</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <!-- Cabeçalho Institucional IFSP com Logotipo Exclusivo e Selo VERSÃO BETA -->
  <header class="top">
    <a class="brand" href="#" aria-label="Início Click Climatização IFSP">
      <!-- Logotipo Exclusivo: Grade Oficial IFSP (Círculo Vermelho + Blocos Verdes) integrada a Ondas de Climatização -->
      <svg class="brand-logo-svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="46" height="46" rx="10" fill="#ffffff" stroke="#2f9e41" stroke-width="2"/>
        <!-- Coluna 1 da Marca IFSP -->
        <circle cx="11" cy="11" r="4.2" fill="#cd2a2e"/>
        <rect x="7" y="17.5" width="8" height="8" rx="2" fill="#2f9e41"/>
        <rect x="7" y="27.5" width="8" height="8" rx="2" fill="#2f9e41"/>
        <rect x="7" y="37.5" width="8" height="5.5" rx="1.5" fill="#0c3b25"/>
        <!-- Coluna 2 da Marca IFSP -->
        <rect x="17" y="7" width="8" height="8" rx="2" fill="#2f9e41"/>
        <rect x="17" y="17.5" width="8" height="8" rx="2" fill="#2f9e41"/>
        <rect x="17" y="27.5" width="8" height="8" rx="2" fill="#2f9e41"/>
        <!-- Coluna 3 + Ondas de Brisa Térmica -->
        <rect x="27" y="7" width="8" height="8" rx="2" fill="#2f9e41"/>
        <rect x="27" y="27.5" width="8" height="8" rx="2" fill="#2f9e41"/>
        <path d="M28 20.5c3-2.5 6-2.5 9 0s6 2.5 6 0" stroke="#186cb8" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M28 24c3-2.5 6-2.5 9 0s6 2.5 6 0" stroke="#2f9e41" stroke-width="2.6" stroke-linecap="round"/>
      </svg>

      <div class="brand-text-wrap">
        <div class="brand-title-row">
          <span class="brand-name">Click</span>
          <span class="brand-inst">IFSP</span>
        </div>
        <span class="brand-sub">Sistema de Climatização das Salas</span>
      </div>
    </a>

    <div class="top-right">
      <div id="summaryPills" class="summary-pills" aria-label="Resumo geral das salas"></div>
      <span id="demoTag" class="demo-tag" hidden>Modo demonstração</span>
      <span class="beta-stamp" title="Projeto institucional em fase de testes">
        <span class="beta-dot" aria-hidden="true"></span>
        <span>Versão Beta</span>
      </span>
    </div>
  </header>

  <div class="shell">
    <!-- Barra Lateral de Salas -->
    <nav class="rooms" aria-label="Salas">
      <!-- Ilustração Vetorial do Bloco Acadêmico IFSP -->
      <div class="campus-card" aria-hidden="true">
        <svg class="campus-svg" viewBox="0 0 64 52" fill="none">
          <rect x="2" y="16" width="60" height="32" rx="3" fill="#e5f3e8" stroke="#0c3b25" stroke-width="2"/>
          <rect x="18" y="6" width="28" height="42" rx="2" fill="#ffffff" stroke="#0c3b25" stroke-width="2"/>
          <rect x="22" y="10" width="20" height="5" rx="1" fill="#2f9e41"/>
          <circle cx="25" cy="12.5" r="1.3" fill="#cd2a2e"/>
          <!-- Janelas do Bloco -->
          <rect x="7" y="22" width="7" height="7" rx="1" fill="#ffffff" stroke="#0c3b25" stroke-width="1.5"/>
          <rect x="7" y="33" width="7" height="7" rx="1" fill="#ffffff" stroke="#0c3b25" stroke-width="1.5"/>
          <rect x="50" y="22" width="7" height="7" rx="1" fill="#ffffff" stroke="#0c3b25" stroke-width="1.5"/>
          <rect x="50" y="33" width="7" height="7" rx="1" fill="#ffffff" stroke="#0c3b25" stroke-width="1.5"/>
          <!-- Porta Central -->
          <rect x="27" y="34" width="10" height="14" fill="#2f9e41" stroke="#0c3b25" stroke-width="1.5"/>
          <rect x="23" y="20" width="7" height="8" rx="1" fill="#e5f3e8" stroke="#0c3b25" stroke-width="1.5"/>
          <rect x="34" y="20" width="7" height="8" rx="1" fill="#e5f3e8" stroke="#0c3b25" stroke-width="1.5"/>
          <line x1="0" y1="48" x2="64" y2="48" stroke="#0c3b25" stroke-width="2"/>
        </svg>
        <div class="campus-info">
          <h2>Salas e Laboratórios</h2>
          <p>Controle remoto centralizado</p>
        </div>
      </div>

      <div class="rooms-controls">
        <label class="search" id="searchBox">
          <span class="sr">Buscar sala</span>
          <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="M21 21l-4.35-4.35"></path>
          </svg>
          <input id="search" type="search" placeholder="Buscar sala ou laboratório..." autocomplete="off">
        </label>

        <div class="filter-tabs" role="tablist" aria-label="Filtrar salas">
          <button type="button" class="filter-tab active" data-status-filter="all">Todas</button>
          <button type="button" class="filter-tab" data-status-filter="on">Ligadas</button>
          <button type="button" class="filter-tab" data-status-filter="offline">Sem conexão</button>
        </div>
      </div>

      <ul id="roomList" class="room-list"></ul>
    </nav>

    <!-- Palco Principal -->
    <main id="stage" class="stage" aria-live="polite"></main>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="demo.js"></script>
  <script src="app.js"></script>
</body>
</html>
